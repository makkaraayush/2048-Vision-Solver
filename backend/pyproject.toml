[tool.poetry]
name = "2048-vision-solver"
version = "0.1.0"
description = "High-performance CV-based 2048 Expectimax Solver"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
opencv-python = "^4.8.0"
numpy = "^1.26.0"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
mss = "^9.0.1"
pydantic = "^2.4.2"
keyboard = "^0.13.5"
numba = "^0.58.1"
pyautogui = "^0.9.54"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.10.1"
ruff = "^0.1.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
